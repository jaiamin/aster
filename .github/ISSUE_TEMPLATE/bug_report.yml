name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug!

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: Affected Data Layer
      description: Which data layer is affected (if applicable)?
      options:
        - N/A
        - Flights
        - Ships
        - Earthquakes
        - Volcanoes
        - Wildfires
        - Storms
        - Satellites
        - Air Quality
        - Buoys
        - Launches
        - Airports
        - Ports
        - Submarine Cables
        - Power Plants
        - Nuclear Facilities

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, deployment method
      placeholder: |
        - Browser: Chrome 120
        - OS: macOS 15
        - Deployment: Docker / Local dev
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Add screenshots if applicable
    validations:
      required: false
